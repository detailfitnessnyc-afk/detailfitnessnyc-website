<!-- ADD THIS RIGHT BEFORE </body> (near the bottom) -->

<!-- ✅ BACK TO TOP BUTTON -->
<button id="backToTop" aria-label="Back to top">
  ↑
</button>

<style>

/* BACK TO TOP BUTTON */

#backToTop{

  position:fixed;

  right:18px;

  bottom:110px; /* sits above sticky CTA */

  width:52px;

  height:52px;

  border-radius:50%;

  border:none;

  cursor:pointer;

  font-size:22px;

  font-weight:900;

  color:#0b0b0b;

  background:
  linear-gradient(
  180deg,
  #d7bf86 0%,
  #c8a96a 100%);

  box-shadow:
  0 12px 30px rgba(0,0,0,.55);

  opacity:0;

  transform:
  translateY(20px);

  pointer-events:none;

  transition:
  opacity .35s ease,
  transform .35s ease;

  z-index:9998;

}

/* visible state */

#backToTop.show{

  opacity:1;

  transform:
  translateY(0);

  pointer-events:auto;

}

/* hover desktop */

#backToTop:hover{

transform:scale(1.06);

}

</style>


<script>

/* SHOW BUTTON AFTER SCROLL */

const backToTop =
document.getElementById("backToTop");

window.addEventListener("scroll",()=>{

if(window.scrollY > 450){

backToTop.classList.add("show");

}else{

backToTop.classList.remove("show");

}

});


/* SMOOTH SCROLL */

backToTop.addEventListener("click",()=>{

window.scrollTo({

top:0,

behavior:"smooth"

});

});

</script>
